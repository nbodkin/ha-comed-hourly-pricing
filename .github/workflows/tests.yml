name: Tests

on:
  # Other branches are checked when a pull request is opened, so they aren't
  # checked twice. Run the workflow by hand to check one without a PR.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install ruff
        run: python -m pip install "$(grep '^ruff==' requirements_test.txt)"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  pytest:
    # The oldest Home Assistant in hacs.json, and the newest the test plugin supports.
    name: Pytest (Home Assistant ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `pinned_in` is the file the requirement is written in. The pip cache
        # is keyed on it, so each row gets its own cache.
        include:
          - homeassistant: "2026.8"
            requirement: pytest-homeassistant-custom-component==0.13.357
            pinned_in: .github/workflows/tests.yml
          - homeassistant: latest
            requirement: -r requirements_test.txt
            pinned_in: requirements_test.txt
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.pinned_in }}
      - name: Install dependencies
        run: python -m pip install ${{ matrix.requirement }}
      - name: Run tests
        run: python -m pytest
